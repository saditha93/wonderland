server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # Avoid logging URLs that might contain private data. APIs log sanitized route templates.
    access_log off;
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location /api/attractions/ { proxy_pass http://attractions-service:8000/; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
    location /api/booking/ { proxy_pass http://booking-service:8000/; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
    location /api/gate/ { proxy_pass http://gate-ride-service:8000/; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
    location /api/analytics/ { proxy_pass http://analytics-worker:8000/; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; proxy_connect_timeout 3s; proxy_read_timeout 15s; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
