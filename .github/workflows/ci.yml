name: Local application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Disposable CI-only database; never an AWS or production credential.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/wonderland_test
    services:
      test-postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: wonderland_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false
      - name: Offline Terraform validation and mocked plans
        run: python scripts/validate-cloud.py
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high
      - run: python scripts/configure-compose.py
      - run: docker compose --env-file secrets/compose.env config --quiet
      - run: docker compose --env-file secrets/compose.env build
      - name: Build static Kubernetes frontend image
        run: docker build -f frontend/Dockerfile.kubernetes -t wonderland/frontend:ci frontend
      - name: Start containers, migrate, seed, and verify HTTP health
        run: |
          docker compose --env-file secrets/compose.env up -d --wait --wait-timeout 180 postgres migrate attractions-service booking-service gate-ride-service analytics-worker
          python scripts/smoke-local.py
      - if: always()
        run: docker compose --env-file secrets/compose.env down --volumes
# No AWS credentials, cloud resources, payment calls or deployment actions.
