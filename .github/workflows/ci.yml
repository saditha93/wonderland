name: Local foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-local-only-password
      - run: docker compose build
      - name: Start local containers and verify HTTP health
        run: |
          docker compose up -d --wait --wait-timeout 180 postgres attractions-service booking-service gate-ride-service analytics-worker
          python scripts/smoke-local.py
        env:
          POSTGRES_PASSWORD: ci-local-only-password
      - if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-local-only-password
# No cloud credentials or deployment actions. Deployment with OIDC and explicit
# protected-environment approval is a Phase 6 deliverable.
