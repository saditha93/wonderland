apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attractions-blue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attractions-service-blue
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
