apiVersion: apps/v1
kind: Deployment
metadata:
  name: attractions-service-blue
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels: &id001
      app: attractions-service
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: api
        image: wonderland/attractions-service:0.5.0
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: APP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: attractions-db
              key: database-url
        - name: APP_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secret
              key: signing-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(5)
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: attractions-service
spec:
  selector:
    app: attractions-service
    color: blue
  ports:
  - name: http
    port: 8000
    targetPort: http
---
