# EC2 Minikube Ingress: strip the public prefix, then verify HTTPS to each API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-attractions
  namespace: wonderland
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: wonderland/ingress-ca
    nginx.ingress.kubernetes.io/proxy-ssl-verify: 'on'
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: 'on'
    nginx.ingress.kubernetes.io/proxy-ssl-name: attractions-service
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/enable-access-log: 'false'
spec:
  ingressClassName: nginx
  tls:
  - secretName: frontend-tls
  rules:
  - http:
      paths:
      - path: /api/attractions(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: attractions-service
            port:
              number: 8000
---
